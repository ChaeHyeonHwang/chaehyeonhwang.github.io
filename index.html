<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이언컨설팅그룹 | 기업 컨설팅 문의</title>
<meta name="description" content="이언컨설팅그룹에 기업 경영 컨설팅 관련 문의를 남겨주세요. 서울 강남구 테헤란로 소재, 담당 컨설턴트가 빠르게 연락드립니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: "Inter","Pretendard","Noto Sans KR",-apple-system,sans-serif; }
  .split {
    display:grid;
    grid-template-columns: 1fr 1fr;
    min-height:760px;
  }
  /* 왼쪽 폼 영역 */
  .form-side {
    position:relative;
    background: linear-gradient(160deg, #FAF8F3 0%, #F3EDDF 55%, #EDE4CF 100%);
    padding:80px 64px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .form-side::before {
    content:"";
    position:absolute;
    top:-15%; left:-10%;
    width:60%; height:60%;
    background: linear-gradient(115deg, transparent 42%, rgba(11,31,58,0.025) 43%, rgba(11,31,58,0.025) 46%, transparent 47%);
  }
  .eyebrow {
    position:relative; z-index:2;
    color:#9C7A34;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:18px;
  }
  .accent-line {
    position:relative; z-index:2;
    width:44px; height:2px;
    background:#C9A961;
    margin-bottom:26px;
  }
  .brand {
    position:relative; z-index:2;
    font-family:'Playfair Display',serif;
    color:#0B1F3A;
    font-size:22px;
    font-weight:600;
    letter-spacing:.3px;
    margin-bottom:22px;
  }
  h1 {
    position:relative; z-index:2;
    font-family:'Playfair Display',serif;
    color:#0B1F3A;
    font-size:36px;
    font-weight:500;
    letter-spacing:-.3px;
    margin-bottom:14px;
  }
  .lead {
    position:relative; z-index:2;
    color:#6B6558;
    font-size:15.5px;
    font-weight:300;
    line-height:1.7;
    margin-bottom:44px;
    max-width:420px;
  }
  form { position:relative; z-index:2; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:22px; }
  .field { display:flex; flex-direction:column; }
  .field label {
    color:#8A8578;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:9px;
  }
  .field input, .field textarea {
    background:#ffffff;
    border:1px solid rgba(11,31,58,0.15);
    border-radius:4px;
    padding:13px 14px;
    color:#0B1F3A;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .field input:focus, .field textarea:focus {
    border-color:#C9A961;
    background:#fffdf8;
  }
  .field input::placeholder, .field textarea::placeholder { color:#B0AA9B; }
  .field.full { margin-bottom:30px; }
  textarea { resize:none; height:110px; }
  button.submit {
    background:#C9A961;
    color:#08182E;
    border:none;
    padding:17px 46px;
    border-radius:4px;
    font-size:17px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s, transform .2s;
  }
  button.submit:hover { background:#E4CE94; transform:translateY(-1px); }
  /* 오른쪽 이미지 영역 */
  .image-side {
    position:relative;
    background: linear-gradient(180deg, rgba(8,24,46,0.4), rgba(8,24,46,0.15)),
                url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
  }
  .info-card {
    position:absolute;
    left:44px; bottom:44px; right:44px;
    background:rgba(8,24,46,0.75);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    padding:30px 32px;
    color:#fff;
  }
  .info-card .row2 {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    align-items:start;
    gap:20px;
  }
  .info-item { min-width:0; }
  .info-item .k { font-size:11px; letter-spacing:1.5px; color:#E4CE94; margin-bottom:6px; text-transform:uppercase; }
  .info-item .v { font-size:14px; font-weight:400; line-height:1.5; word-break:keep-all; }
  @media (max-width:900px){
    .split { grid-template-columns:1fr; }
    .image-side { min-height:340px; order:-1; }
    .form-side { padding:56px 28px; }
    .row { grid-template-columns:1fr; }
    .info-card .row2 { grid-template-columns:1fr; gap:16px; }
  }
</style>
</head>
<body>
  <div class="split">
    <div class="form-side">
      <div class="brand">이언컨설팅그룹</div>
      <div class="eyebrow">GET IN TOUCH</div>
      <div class="accent-line"></div>
      <h1>We are here for questions<br>or consulting</h1>
      <div class="lead">기관의 현안과 목표를 들려주세요. 담당 컨설턴트가 빠르게 연락드리겠습니다.</div>
      <form id="contactForm" action="https://formspree.io/f/mljrrraa" method="POST">
        <input type="hidden" name="_subject" value="[이언컨설팅그룹] 웹사이트 문의">
        <div class="row">
          <div class="field">
            <label>기업명 *</label>
            <input type="text" name="company" placeholder="예: OO기업" required>
          </div>
          <div class="field">
            <label>문의자 성함 *</label>
            <input type="text" name="last_name" placeholder="홍길동" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>EMAIL *</label>
            <input type="email" name="email" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label>PHONE</label>
            <input type="text" name="phone" placeholder="010-0000-0000">
          </div>
        </div>
        <div class="field full">
          <label>MESSAGE</label>
          <textarea name="message" placeholder="문의 내용을 남겨주세요." required></textarea>
        </div>
        <button type="submit" class="submit" id="submitBtn">Submit →</button>
        <div id="formStatus" style="margin-top:16px; font-size:13.5px; color:#9C7A34; display:none;"></div>
      </form>
    </div>
    <div class="image-side">
      <div class="info-card">
        <div style="font-family:'Playfair Display',serif; font-size:18px; font-weight:600; letter-spacing:.3px; margin-bottom:18px;">이언컨설팅그룹</div>
        <div class="row2">
          <div class="info-item">
            <div class="k">Office</div>
            <div class="v">서울특별시 강남구 테헤란로 7길 22</div>
          </div>
          <div class="info-item">
            <div class="k">Email</div>
            <div class="v">eoncg@eoncg.com
</div>
          </div>
          <div class="info-item">
            <div class="k">Tel</div>
            <div class="v">02-556-8088</div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
(function() {
  var form = document.getElementById('contactForm');
  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('formStatus');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    btn.style.opacity = '0.6';
    status.style.display = 'block';
    status.style.color = '#9C7A34';
    status.textContent = '전송 중입니다...';
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function(res) {
      if (res.ok) {
        status.textContent = '문의가 정상적으로 접수되었습니다. 빠른 시일 내 연락드리겠습니다.';
        form.reset();
      } else {
        status.style.color = '#B03A3A';
        status.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
      }
    }).catch(function() {
      status.style.color = '#B03A3A';
      status.textContent = '전송에 실패했습니다. 네트워크 상태를 확인해주세요.';
    }).finally(function() {
      btn.disabled = false;
      btn.style.opacity = '1';
    });
  });
})();
</script>
</body>
</html>
